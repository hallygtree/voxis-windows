<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Claude Code Ops - orb</title>
<link rel="stylesheet" href="/static/voice-orb.css">
<style>
  /* Loaded inside the transparent desktop overlay panel (overlay_app.py):
     same orb, same websocket, no dashboard around it. Siri-like: the orb
     stays SMALL and centered - the .active expansion is a dashboard
     behavior, on the desktop it must only signal listening/waiting. */
  html, body { margin: 0; background: transparent !important; overflow: hidden; }
  canvas { background: transparent !important; display: block; }
  #orb-canvas-wrap, #orb-canvas-wrap.active {
    width: 120px; height: 120px;
    top: 0; left: 0; bottom: auto; right: auto;
    transform: none;
  }
  .hud-frame, .reticle, .scanline-sweep, .amp-readout, .phase-caption {
    display: none !important;
  }
  /* CSS-only fallback orb: shows instantly while three.min.js (669KB)
     downloads + parses. Removed from DOM once three.js starts rendering. */
  #orb-fallback {
    position: fixed; top: 16px; left: 16px;
    width: 80px; height: 80px; border-radius: 50%;
    border: 1.5px solid rgba(90, 220, 225, 0.5);
    box-shadow: 0 0 14px rgba(90, 220, 225, 0.25), inset 0 0 10px rgba(90, 220, 225, 0.08);
    background: transparent;
    animation: orb-fallback-breathe 2s ease-in-out infinite;
    z-index: 0;
  }
  @keyframes orb-fallback-breathe {
    0%, 100% { transform: scale(0.92); opacity: 0.4; }
    50%      { transform: scale(1.0);  opacity: 0.7; }
  }
  #orb-fallback.hide { display: none; }
</style>
</head>
<body>
<div class="phase-caption" id="phaseCaption"></div>
<div id="orb-fallback"></div>
<div id="orb-canvas-wrap">
  <div class="hud-frame"><div class="c2"></div></div>
  <div class="reticle ret-1"></div>
  <div class="reticle ret-2"></div>
  <div class="reticle ret-3"></div>
  <div class="reticle ret-ticks"></div>
  <div class="scanline-sweep"></div>
  <div class="amp-readout"><span class="lbl">AMP</span><div class="track"><div class="fill" id="ampFill"></div></div></div>
</div>
<script src="/static/vendor/three.min.js"></script>
<script src="/static/voice-orb.js"></script>
</body>
</html>
