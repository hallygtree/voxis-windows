<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>orb preview</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="orb" width="190" height="190"></canvas>
<script>
const PAL = { accent: "#3fb6c4", hot: "#d8f4f7" };  // Blade
function hexToRgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function rgba(hex,a){const [r,g,b]=hexToRgb(hex);return `rgba(${r},${g},${b},${a})`;}

const ctx = document.getElementById("orb").getContext("2d");
const size = 190, C = 95, S = size / 280, N = 56;
const bands = new Array(N).fill(0);
const ghosts = [new Array(N).fill(0), new Array(N).fill(0)];
let ghostClock = 0;

let T = 0, smoothed = 0, pulse = 0, wasActive = false;
let glitchAt = 4 + Math.random() * 3, glitchLife = 0;
function tick(dt) {
  T += dt;
  const active = (Math.floor(T / 7) % 2) === 1;   // 7s idle, 7s speaking
  if (active && !wasActive) pulse = 1.0;
  wasActive = active;
  if (pulse > 0.001) pulse *= 0.90; else pulse = 0;
  let target = 0;
  if (active) {
    const phrase = (Math.sin(T * 0.9) + 1) / 2;
    target = phrase < 0.22 ? 0.02
      : 0.18 + Math.max(0, Math.sin(T * 5.2) * 0.5 + Math.sin(T * 8.7) * 0.3) * 0.6;
  }
  smoothed += (target - smoothed) * (target > smoothed ? 0.5 : 0.08);
  glitchAt -= dt;
  if (glitchAt <= 0) { glitchLife = 0.12; glitchAt = 4 + Math.random() * 4; }
  if (glitchLife > 0) glitchLife -= dt;
  return { active, v: Math.min(1, smoothed + pulse * 0.5), glitch: glitchLife > 0 };
}

function draw(s) {
  ctx.clearRect(0, 0, size, size);
  const dim = s.active ? 1 : 0.75;
  const R0 = 62 * S;
  const glitchShift = s.glitch ? (Math.random() - 0.5) * 4 * S : 0;

  const coreR = (6 + s.v * 4) * S;
  const g = ctx.createRadialGradient(C, C, 1, C, C, coreR * 3.2);
  g.addColorStop(0, rgba(PAL.hot, 0.95 * dim + s.v * 0.05));
  g.addColorStop(0.4, rgba(PAL.accent, 0.30 * dim + s.v * 0.25));
  g.addColorStop(1, rgba(PAL.accent, 0));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(C, C, coreR * 3.2, 0, 7); ctx.fill();

  ctx.setLineDash([3 * S, 5 * S]);
  ctx.beginPath(); ctx.arc(C, C, 46 * S + s.v * 3 * S, 0, 7);
  ctx.strokeStyle = rgba(PAL.accent, 0.5 * dim); ctx.lineWidth = 1.3; ctx.stroke();
  ctx.setLineDash([]);

  ghostClock++;
  if (ghostClock % 5 === 0) { ghosts[1] = ghosts[0].slice(); ghosts[0] = bands.slice(); }

  for (let i = 0; i < N; i++) {
    const band = Math.abs(Math.sin(i * 0.55 + T * 3.1) * Math.sin(i * 0.13 + T * 1.7));
    const target = s.active ? s.v * band : 0.03 * Math.abs(Math.sin(i + T));
    bands[i] += (target - bands[i]) * (target > bands[i] ? 0.5 : 0.12);
    const ang = -Math.PI / 2 + (i / N) * Math.PI * 2;
    const cos = Math.cos(ang), sin = Math.sin(ang);
    for (let layer = 1; layer >= 0; layer--) {
      const val = layer === 0 ? bands[i] : ghosts[layer][i];
      if (layer > 0 && val < 0.02) continue;
      const h = (4 + val * 46) * S;
      ctx.beginPath();
      ctx.moveTo(C + cos * R0 + (layer ? 0 : glitchShift), C + sin * R0);
      ctx.lineTo(C + cos * (R0 + h) + (layer ? 0 : glitchShift), C + sin * (R0 + h));
      ctx.strokeStyle = layer === 0
        ? rgba(val > 0.55 ? PAL.hot : PAL.accent, (0.60 + val * 0.40) * dim)
        : rgba(PAL.accent, 0.18 * dim);
      ctx.lineWidth = 3 * S * 1.35;
      ctx.stroke();
    }
  }

  ctx.beginPath(); ctx.arc(C, C, 124 * S, 0, 7);
  ctx.strokeStyle = rgba(PAL.accent, 0.30 * dim + s.v * 0.25); ctx.lineWidth = 1.2; ctx.stroke();
  if (s.glitch) {
    const a0 = Math.random() * 7;
    ctx.beginPath(); ctx.arc(C + 3 * S, C, 124 * S, a0, a0 + 0.5);
    ctx.strokeStyle = rgba(PAL.hot, 0.7); ctx.lineWidth = 1.4; ctx.stroke();
  }
}

(function loop() { requestAnimationFrame(loop); draw(tick(1 / 60)); })();
</script>
</body>
</html>
