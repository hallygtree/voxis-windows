[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laris"
version = "0.1.0"
description = "Local Audio Recognition & Input System - mute PTT/hands-free transcriber core"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["laris*"]
