name: security-audit

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 9 * * 1" # Monday 09:00 UTC - catch advisories published since last push
  workflow_dispatch:

permissions:
  contents: read

# Covers the cross-platform artifact shipped to users (the Tauri tray).
# The Python engines are macOS-only (mlx has no Linux wheel, so pip-audit
# can't resolve them on a generic runner); audit them locally in each venv:
#   pip-audit --path packages/<engine>/.venv/lib/python3.11/site-packages
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: apps/tray/src-tauri
          # the action ignores audit.toml; its own ignore input carries the
          # same list - all GTK3/glib/unic transitive warnings from Tauri's
          # Linux webview backend (0 real vulnerabilities). See audit.toml.
          ignore: RUSTSEC-2024-0370,RUSTSEC-2024-0411,RUSTSEC-2024-0412,RUSTSEC-2024-0413,RUSTSEC-2024-0414,RUSTSEC-2024-0415,RUSTSEC-2024-0416,RUSTSEC-2024-0417,RUSTSEC-2024-0418,RUSTSEC-2024-0419,RUSTSEC-2024-0420,RUSTSEC-2024-0429,RUSTSEC-2025-0075,RUSTSEC-2025-0080,RUSTSEC-2025-0081,RUSTSEC-2025-0098,RUSTSEC-2025-0100

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - working-directory: apps/tray
        run: npm audit --audit-level=high
