name: tray-build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# least privilege: tauri-action only needs to draft a release + upload assets
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      # actions pinned by commit SHA (a moved tag can ship malicious code) -
      # comments track the human-readable version
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      # SHA pin loses the channel that the @stable tag name normally carries,
      # so the toolchain must be named explicitly
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master @ 2026-07-17
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/tray/src-tauri

      - name: Linux system deps (webkit + tray)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend deps
        working-directory: apps/tray
        run: npm install

      - name: Rust tests
        working-directory: apps/tray/src-tauri
        run: cargo test

      - name: Set up Python (Windows engine)
        if: matrix.platform == 'windows-latest'
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: "3.11"

      # whisper.cpp is the STT engine on Windows. Upstream publishes no Vulkan
      # asset (only cpu / blas / cublas), so it is built here from a pinned tag.
      # Vulkan is what makes GPU acceleration work on AMD and Intel as well as
      # NVIDIA, and its loader ships with the GPU driver - the CUDA route needed
      # ~2 GB of redistributable DLLs for NVIDIA alone.
      #
      # The checkout, cache and build live in a composite action shared with
      # whispercpp-cache.yml, which is what writes the cache on the default
      # branch: Actions scopes caches by ref, so a cache written by one tag run
      # is invisible to the next.
      - name: whisper.cpp (Vulkan)
        if: matrix.platform == 'windows-latest'
        uses: ./.github/actions/whispercpp-build

      # Separate from the build so it still runs on a cache hit, and so a cache
      # that restored something unusable fails here rather than shipping an
      # engine that cannot transcribe.
      - name: Stage whisper.cpp for both engines
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        working-directory: whisper.cpp
        run: |
          foreach ($dest in @("../packages/laris/whispercpp", "../packages/miris/whispercpp")) {
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Copy-Item build/bin/Release/*.exe $dest -Force
            Copy-Item build/bin/Release/*.dll $dest -Force
          }
          foreach ($needed in @("whisper-server.exe", "parakeet-cli.exe", "ggml-vulkan.dll")) {
            if (-not (Test-Path "../packages/laris/whispercpp/$needed")) {
              throw "$needed is missing - the engines cannot transcribe without it"
            }
          }
          Get-ChildItem ../packages/laris/whispercpp | ForEach-Object { "{0,12:N0}  {1}" -f $_.Length, $_.Name }

      # Silero VAD for hands-free: pinned tag, MIT, 2.2 MB. Shipped in the
      # installer rather than downloaded on first use - a file this small does
      # not justify another wait. laris.spec hard-fails without it instead of
      # producing an engine whose hands-free toggle silently does nothing.
      - name: Fetch the Silero VAD model
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path packages/laris/assets | Out-Null
          curl.exe -sSL --fail -o packages/laris/assets/silero_vad.onnx `
            "https://github.com/snakers4/silero-vad/raw/v5.1.2/src/silero_vad/data/silero_vad.onnx"
          $size = (Get-Item packages/laris/assets/silero_vad.onnx).Length
          "silero_vad.onnx: {0:N0} bytes" -f $size
          if ($size -lt 500000) { throw "silero_vad.onnx looks truncated ($size bytes)" }

      - name: Build frozen laris engine (Windows)
        if: matrix.platform == 'windows-latest'
        working-directory: packages/laris
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-windows.txt pyinstaller
          pip install -e .
          pyinstaller packaging/laris.spec --noconfirm
          # stage the onedir output where tauri.windows.conf.json expects it
          New-Item -ItemType Directory -Force -Path ../../apps/tray/src-tauri/engine | Out-Null
          Copy-Item -Recurse -Force dist/laris-engine/* ../../apps/tray/src-tauri/engine/
        shell: pwsh

      - name: Build frozen miris engine (Windows)
        if: matrix.platform == 'windows-latest'
        working-directory: packages/miris
        run: |
          pip install -r requirements-windows.txt pyinstaller
          pip install -e .
          pyinstaller packaging/miris.spec --noconfirm
          # stage the onedir output where tauri.windows.conf.json expects it
          New-Item -ItemType Directory -Force -Path ../../apps/tray/src-tauri/engine-miris | Out-Null
          Copy-Item -Recurse -Force dist/miris-engine/* ../../apps/tray/src-tauri/engine-miris/
        shell: pwsh

      # On tag pushes this drafts a GitHub release with the installers
      # (.dmg / .msi / .deb / .AppImage); on manual dispatch it only builds.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/tray
          args: ${{ matrix.platform == 'windows-latest' && '--config src-tauri/tauri.windows.conf.json' || '' }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('VOXIS {0}', github.ref_name) || '' }}
          releaseDraft: true

      - name: Upload installers (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voxis-tray-${{ matrix.platform }}
          path: |
            apps/tray/src-tauri/target/release/bundle/dmg/*.dmg
            apps/tray/src-tauri/target/release/bundle/macos/*.app/**
            apps/tray/src-tauri/target/release/bundle/msi/*.msi
            apps/tray/src-tauri/target/release/bundle/nsis/*.exe
            apps/tray/src-tauri/target/release/bundle/deb/*.deb
            apps/tray/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
